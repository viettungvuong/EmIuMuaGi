name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 0. Stop before building if a secret the services need isn't set in GitHub
      - name: Check Secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          missing=""
          for name in DATABASE_URL JWT_SECRET JWT_REFRESH_SECRET REDIS_URL SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # 1. Build Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: "/api"

      # 2. Build Backend (Linux Binaries)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build Backend Services
        working-directory: ./backend
        run: |
          mkdir -p bin
          cd api-gateway && GOOS=linux GOARCH=amd64 go build -o ../bin/api-gateway . && cd ..
          cd user-service && GOOS=linux GOARCH=amd64 go build -o ../bin/user-service . && cd ..
          cd item-service && GOOS=linux GOARCH=amd64 go build -o ../bin/item-service . && cd ..

      # Python needs no build: ship just the code (not the venv/ committed in the
      # repo); install.sh sets up a fresh .venv on the VPS
      - name: Package AI Service
        run: tar -czf ai-service.tgz --exclude=__pycache__ -C backend/ai-service main.py requirements.txt install.sh app

      # 3. Upload to VPS
      - name: Copy Files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "frontend/dist/*,backend/bin/*,backend/migrations/*,ai-service.tgz"
          target: "~/emiumuagi"

      # 4. Restart Services
      - name: Restart Services on VPS
        uses: appleboy/ssh-action@master
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          # Exported into the script below, which writes them to each service's .env
          envs: DATABASE_URL,JWT_SECRET,JWT_REFRESH_SECRET,REDIS_URL,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM
          # Default is 10m; leaves room for the AI service's first-time setup
          # (a fresh .venv) on a slow VPS. Normal deploys take well under a minute.
          command_timeout: 30m
          script: |
            cd ~/emiumuagi

            # Setup Folder Structure (if it doesn't exist)
            mkdir -p backend/services/item-service backend/services/user-service backend/services/api-gateway backend/services/ai-service

            # Each service's .env, from the GitHub secrets (readable only by this user).
            # Single-quoted so the dotenv loader takes the values literally.
            write_env() {
              file=$1; shift
              ( umask 077; for name in "$@"; do eval "value=\$$name"; printf "%s='%s'\n" "$name" "$value"; done > "$file" )
            }
            write_env backend/services/user-service/.env \
              DATABASE_URL JWT_SECRET JWT_REFRESH_SECRET REDIS_URL SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM
            write_env backend/services/item-service/.env DATABASE_URL JWT_SECRET

            # Apply new backend/migrations/<YYYYMMDD>_*.sql files before the new binaries
            # go live. If one fails, the deploy stops here and the old services keep running.
            bash backend/migrations/migrate.sh backend/migrations backend/services/item-service/.env || exit 1

            # AI service: replace its code (keeping .venv), then
            # update its packages. A failure stops the deploy like a migration does.
            rm -rf backend/services/ai-service/app
            tar -xzf ai-service.tgz -C backend/services/ai-service && rm ai-service.tgz
            bash backend/services/ai-service/install.sh || exit 1

            # Move binaries to their specific service folders
            mv -f backend/bin/item-service backend/services/item-service/ || true
            mv -f backend/bin/user-service backend/services/user-service/ || true
            mv -f backend/bin/api-gateway backend/services/api-gateway/ || true

            # Ensure the binaries are executable
            chmod +x backend/services/*-service/* backend/services/api-gateway/*

            # pm2 runs only the gateway now; it starts the other services itself and
            # moves one to the next port when its usual one is taken
            pm2 delete gateway user-service item-service ai-service || true
            cd backend/services/api-gateway && pm2 start api-gateway --name gateway --kill-timeout 10000

            # pm2 reports success even when a service crashes right after starting,
            # so wait for the gateway to report a port for every service; if one
            # never comes up, show why and fail
            ready() {
              ports=$(curl -sf http://127.0.0.1:8000/_gateway/services) || return 1
              for name in user-service item-service ai-service; do
                echo "$ports" | grep -qE "\"$name\":[1-9]" || return 1
              done
            }
            for i in $(seq 1 60); do
              ready && break
              sleep 1
            done
            if ready; then
              echo "All services are up: $(curl -s http://127.0.0.1:8000/_gateway/services)"
            else
              echo "Not every service came up: $(curl -s http://127.0.0.1:8000/_gateway/services || echo 'gateway not answering')"
              pm2 logs gateway --lines 60 --nostream || true
              exit 1
            fi
