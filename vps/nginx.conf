# Redirect the domain from HTTP to HTTPS
server {
    listen 80;
    server_name emiumuagi.online www.emiumuagi.online;
    return 301 https://emiumuagi.online$request_uri;
}

# HTTPS (Let's Encrypt cert managed by certbot on the VPS)
server {
    listen 443 ssl http2;
    server_name emiumuagi.online www.emiumuagi.online;

    ssl_certificate /etc/letsencrypt/live/emiumuagi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emiumuagi.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/emiumuagi-app.conf;
}

# Plain HTTP on the bare IP (still used by older mobile builds)
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/emiumuagi-app.conf;
}
