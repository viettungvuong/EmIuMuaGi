name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 1. Build Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: "/api"

      # 2. Build Backend (Linux Binaries)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build Backend Services
        working-directory: ./backend
        run: |
          mkdir -p bin
          cd api-gateway && GOOS=linux GOARCH=amd64 go build -o ../bin/api-gateway . && cd ..
          cd user-service && GOOS=linux GOARCH=amd64 go build -o ../bin/user-service . && cd ..
          cd item-service && GOOS=linux GOARCH=amd64 go build -o ../bin/item-service . && cd ..

      # Python needs no build: ship just the code (not the venv/ committed in the
      # repo); install.sh sets up a fresh .venv on the VPS
      - name: Package AI Service
        run: tar -czf ai-service.tgz --exclude=__pycache__ -C backend/ai-service main.py requirements.txt install.sh app

      # 3. Upload to VPS
      - name: Copy Files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "frontend/dist/*,backend/bin/*,backend/migrations/*,ai-service.tgz"
          target: "~/emiumuagi"

      # 4. Restart Services
      - name: Restart Services on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          # Default is 10m; leaves room for the AI service's first-time setup
          # (a fresh .venv) on a slow VPS. Normal deploys take well under a minute.
          command_timeout: 30m
          script: |
            cd ~/emiumuagi

            # Setup Folder Structure (if it doesn't exist)
            mkdir -p backend/services/item-service backend/services/user-service backend/services/api-gateway backend/services/ai-service

            # Apply new backend/migrations/<YYYYMMDD>_*.sql files before the new binaries
            # go live. If one fails, the deploy stops here and the old services keep running.
            bash backend/migrations/migrate.sh backend/migrations backend/services/item-service/.env || exit 1

            # AI service: replace its code (keeping .venv), then
            # update its packages. A failure stops the deploy like a migration does.
            rm -rf backend/services/ai-service/app
            tar -xzf ai-service.tgz -C backend/services/ai-service && rm ai-service.tgz
            bash backend/services/ai-service/install.sh || exit 1

            # Move binaries to their specific service folders
            mv -f backend/bin/item-service backend/services/item-service/ || true
            mv -f backend/bin/user-service backend/services/user-service/ || true
            mv -f backend/bin/api-gateway backend/services/api-gateway/ || true

            # Ensure the binaries are executable
            chmod +x backend/services/*-service/* backend/services/api-gateway/*

            # Restart all services using PM2
            pm2 delete gateway user-service item-service ai-service || true

            # Start each service from its respective folder (so it picks up its own .env)
            cd backend/services/api-gateway && pm2 start api-gateway --name gateway
            cd ../user-service && pm2 start user-service --name user-service
            cd ../item-service && pm2 start item-service --name item-service
            # Only the gateway on this machine talks to it, so listen on localhost only
            cd ../ai-service && pm2 start .venv/bin/uvicorn --name ai-service --interpreter none -- main:app --host 127.0.0.1 --port 8004

            # pm2 reports success even when the process crashes right after starting,
            # so wait for the AI service to answer; if it never does, show why and fail
            for i in $(seq 1 30); do
              curl -sf -o /dev/null http://127.0.0.1:8004/ && break
              sleep 1
            done
            if curl -sf -o /dev/null http://127.0.0.1:8004/; then
              echo "ai-service is up on port 8004"
            else
              echo "ai-service did not start. Its pm2 status and last log lines:"
              pm2 describe ai-service | grep -E "status|restarts|script path|exec cwd|error log path" || true
              pm2 logs ai-service --lines 40 --nostream || true
              exit 1
            fi
